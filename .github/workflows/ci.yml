# NOTE: John's fine-grained token ('Muse miazucr', Contents read+write on this repo)
# does NOT have the Actions permission, so this file cannot be pushed to
# .github/workflows/ via the Git Data API — GitHub returns 403
# ("Resource not accessible by personal access token") on any tree
# containing a workflow file. ADD THIS FILE MANUALLY ON github.com
# (or grant the Actions permission on the token). It will NOT run
# automatically until it exists on the default branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
